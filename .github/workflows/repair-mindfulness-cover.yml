name: Install actual final mindfulness cover

on:
  push:
    paths:
      - '.github/workflows/repair-mindfulness-cover.yml'

permissions:
  contents: write

jobs:
  install-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Rebuild and verify exact cover asset
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/mindfulness-cover-{0..6}.b64 | tr -d '\r\n' | base64 --decode > images/web/field-notes-on-mindfulness-final.webp
          actual="$(sha256sum images/web/field-notes-on-mindfulness-final.webp | awk '{print $1}')"
          expected="15abbbbb8c4db91f7038aa17a19706614e9cacdc769ad7f9d5bd84d04140233f"
          test "$actual" = "$expected"
          python - <<'PY'
          from pathlib import Path
          p = Path('images/web/field-notes-on-mindfulness-final.webp')
          data = p.read_bytes()
          assert len(data) == 41054, len(data)
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', data[:12]
          PY

      - name: Point Exclusives page at the final cover
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('website-exclusives.html')
          s = p.read_text(encoding='utf-8')
          old = '<img src="images/web/field-notes-on-mindfulness-cover.jpg?v=20260821-2237" alt="Field Notes on Mindfulness colouring collection by Ben Athem" width="160" height="240">'
          new = '<img src="images/web/field-notes-on-mindfulness-final.webp?v=20260821-final" alt="Field Notes on Mindfulness colouring collection by Ben Athem" width="420" height="561">'
          if old not in s:
              raise SystemExit('Expected old mindfulness image tag not found; refusing an unsafe edit')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove bad assets and temporary staging files
        run: |
          rm -f images/web/field-notes-on-mindfulness-cover.jpg
          rm -f images/web/field-notes-on-mindfulness.webp
          rm -f .tmp/mindfulness-cover-*.b64
          rm -f payhip-image-candidates.txt
          rm -f .github/workflows/repair-mindfulness-cover.yml

      - name: Commit the verified correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use actual final Field Notes on Mindfulness cover'
          git push

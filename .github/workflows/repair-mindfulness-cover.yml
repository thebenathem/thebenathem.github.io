name: Inspect Payhip mindfulness images

on:
  push:
    paths:
      - '.github/workflows/repair-mindfulness-cover.yml'

permissions:
  contents: write

jobs:
  inspect-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Inspect every Payhip image candidate
        run: |
          python - <<'PY'
          import html
          import io
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from PIL import Image

          product_url = 'https://payhip.com/b/Ux257'
          req = urllib.request.Request(product_url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              page = r.read().decode('utf-8','replace')

          rows = []
          seen = set()

          # Capture URLs from HTML attributes, meta tags, srcsets and embedded JSON/scripts.
          patterns = [
              r'(?:src|data-src|data-lazy-src|content)=["\']([^"\']+)["\']',
              r'https?://[^"\'<>\\ ]+?\.(?:jpg|jpeg|png|webp)(?:\?[^"\'<>\\ ]*)?',
          ]
          raw = []
          for pat in patterns:
              raw.extend(re.findall(pat, page, flags=re.I))

          for item in raw:
              item = html.unescape(item).replace('\\u0026','&').replace('\\/','/')
              for bit in item.split(','):
                  url = bit.strip().split(' ')[0]
                  if not url:
                      continue
                  url = urllib.parse.urljoin(product_url, url)
                  if url in seen:
                      continue
                  seen.add(url)
                  if not re.search(r'\.(?:jpg|jpeg|png|webp)(?:\?|$)', url, re.I):
                      continue
                  try:
                      ir = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Referer':product_url})
                      with urllib.request.urlopen(ir, timeout=20) as resp:
                          data = resp.read()
                      im = Image.open(io.BytesIO(data))
                      rows.append((im.width * im.height, im.width, im.height, im.format, url))
                  except Exception as e:
                      rows.append((0,0,0,'ERROR',url + ' :: ' + repr(e)))

          rows.sort(reverse=True)
          out = ['PAYHIP IMAGE CANDIDATES FOR ' + product_url, '']
          for area,w,h,fmt,url in rows:
              out.append(f'{w}x{h} {fmt} area={area} :: {url}')
          Path('payhip-image-candidates.txt').write_text('\n'.join(out), encoding='utf-8')
          print('\n'.join(out[:50]))
          PY

      - name: Commit candidate report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add payhip-image-candidates.txt
          git commit -m 'Record Payhip mindfulness image candidates' || exit 0
          git push
